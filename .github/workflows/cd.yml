name: DigitalOcean K3s Continuous Deployment

on:
  workflow_run:
    workflows: ["BunBo System Microservices CI"]
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'infra/k8s/**'

jobs:
  check-event:
    name: Check CI Event
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Download Event Artifact
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "Direct push trigger. Proceeding."
            echo "proceed=true" >> $GITHUB_OUTPUT
          elif gh run download ${{ github.event.workflow_run.id }} --name backend-changed --dir /tmp/artifact 2>/dev/null; then
            echo "Backend changes detected in CI. Proceeding."
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "No backend changes detected in CI. Skipping deploy."
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to DigitalOcean K3s
    needs: check-event
    if: ${{ github.event_name == 'push' || needs.check-event.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || 'latest' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # 1. PREPARE Phase
      - name: Set up Kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify Cluster Connection
        run: kubectl cluster-info

      - name: Ensure Node Labels
        run: |
          kubectl label node bunbo-master role=infra --overwrite
          kubectl label node worker-node role=apps --overwrite

      # 2. UPDATE CONFIGURATION
      - name: Prepare Image Tags
        run: |
          if [ -z "${IMAGE_TAG}" ]; then
            echo "::error::IMAGE_TAG is empty, aborting deployment to prevent ImagePullBackOff!"
            exit 1
          fi
          echo "Updating deployment manifests to use image tag: ${IMAGE_TAG}"
          # Replace 'latest' tag with the specific commit SHA to force rolling updates
          find infra/k8s -name "*-deployment.yaml" -exec sed -i "s/:latest/:${IMAGE_TAG}/g" {} +
          
          # Optional: Update Docker username if different from default
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            find infra/k8s -name "*-deployment.yaml" -exec sed -i "s/griox\//${{ secrets.DOCKER_USERNAME }}\//g" {} +
          fi

      # 3. DEPLOY Phase
      - name: Apply Fundamentals
        run: |
          kubectl apply -f infra/k8s/config/
        continue-on-error: true

      - name: Apply Microservices
        run: |
          kubectl apply -f infra/k8s/identity/
          kubectl apply -f infra/k8s/catalog/
          kubectl apply -f infra/k8s/cart/
          kubectl apply -f infra/k8s/order/
          kubectl apply -f infra/k8s/payment/
          kubectl apply -f infra/k8s/notification/
          kubectl apply -f infra/k8s/realtime/
          kubectl apply -f infra/k8s/promotion/
          kubectl apply -f infra/k8s/gateway/

      - name: Force Rollout Restart & Verify (Sequential)
        id: verify_rollout
        run: |
          services=("identity-service" "catalog-service" "cart-service" "order-service" "payment-service" "notification-service" "realtime-service" "promotion-service" "api-gateway")
          
          for service in "${services[@]}"; do
            # Only force restart if it's a direct push (as opposed to image tag update which auto-rolls)
            if [ "${{ github.event_name }}" == "push" ]; then
              echo "Force restarting $service..."
              kubectl rollout restart deployment/$service
            fi
            
            echo "Waiting for rollout of deployment/$service..."
            if ! kubectl rollout status deployment/$service --timeout=300s; then
              echo "::error::Rollout failed for $service. Checking logs for clues..."
              kubectl get pods -l app=$service --no-headers | awk '{print $1}' | xargs -I{} kubectl logs {} --tail=50
              exit 1
            fi
          done
          echo "All deployments verified successfully."

      # 4. HEALTH CHECK Phase
      - name: Verify Service Health Endpoints
        id: health_check
        run: |
          echo "Waiting 30s for services to stabilize..."
          sleep 30
          
          GATEWAY_IP=$(kubectl get svc api-gateway -o jsonpath='{.spec.clusterIP}' 2>/dev/null || echo "")
          if [ -n "$GATEWAY_IP" ]; then
            echo "Checking API Gateway health at $GATEWAY_IP..."
            kubectl run health-check-${{ github.run_id }} \
              --image=curlimages/curl:latest \
              --restart=Never \
              --rm -i \
              --timeout=60s \
              -- curl -sf --max-time 10 "http://$GATEWAY_IP/health" \
              && echo "✅ Health check PASSED" \
              || echo "::warning::⚠️ Health check did not return 200 — service may still be starting"
          else
            echo "::warning::Could not resolve API Gateway service IP, skipping health check"
          fi

      # 5. CONFIRM or ROLLBACK Phase
      - name: Automated Rollback on Failure
        if: failure() && steps.verify_rollout.outcome == 'failure'
        run: |
          echo "::warning::Deployment verification failed, initiating automated rollback..."
          services=("identity-service" "catalog-service" "cart-service" "order-service" "payment-service" "notification-service" "realtime-service" "promotion-service" "api-gateway")
          
          for service in "${services[@]}"; do
            echo "Rolling back deployment/$service..."
            kubectl rollout undo deployment/$service || echo "::warning::No previous rollout history to undo for $service"
            kubectl rollout status deployment/$service --timeout=180s || echo "::error::Rollback confirmation failed for $service"
          done
          exit 1
