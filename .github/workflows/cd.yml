name: DigitalOcean K3s Continuous Deployment

on:
  workflow_run:
    workflows: ["BunBo System Microservices CI"]
    types:
      - completed
    branches:
      - main

jobs:
  check-event:
    name: Check CI Event
    runs-on: ubuntu-22.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      backend_changed: ${{ steps.check.outputs.backend_changed }}
      infra_changed: ${{ steps.check.outputs.infra_changed }}
    steps:
      - name: Download Event Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: deploy-event
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/artifact

      - name: Parse Event Metadata
        id: check
        run: |
          EVENT_FILE="/tmp/artifact/deploy-event.json"
          if [ -f "$EVENT_FILE" ]; then
            BACKEND=$(python3 -c "import json; print(json.load(open('$EVENT_FILE'))['backend_changed'])" | tr '[:upper:]' '[:lower:]')
            INFRA=$(python3 -c "import json; print(json.load(open('$EVENT_FILE'))['infra_changed'])" | tr '[:upper:]' '[:lower:]')
            
            echo "backend_changed=$BACKEND" >> $GITHUB_OUTPUT
            echo "infra_changed=$INFRA" >> $GITHUB_OUTPUT
            
            if [ "$BACKEND" = "true" ] || [ "$INFRA" = "true" ]; then
              echo "Changes detected (backend: $BACKEND, infra: $INFRA). Proceeding with deployment."
              echo "proceed=true" >> $GITHUB_OUTPUT
            else
              echo "No deployable changes (backend: $BACKEND, infra: $INFRA). Skipping."
              echo "proceed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "deploy-event.json not found! Falling back to skipped deployment."
            echo "backend_changed=false" >> $GITHUB_OUTPUT
            echo "infra_changed=false" >> $GITHUB_OUTPUT
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to DigitalOcean K3s
    needs: check-event
    if: ${{ needs.check-event.outputs.proceed == 'true' }}
    runs-on: ubuntu-22.04

    permissions:
      contents: write  # Required for GitOps git push back
      actions: read    # Required to download artifacts from other runs

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      # 1. PREPARE Phase
      - name: Set up Kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify Cluster Connection
        run: kubectl cluster-info

      - name: Ensure Node Labels
        run: |
          kubectl label node bunbo-master role=infra --overwrite
          kubectl label node worker-node role=apps --overwrite

      # 2. DATABASE MIGRATION Phase (Safe, before deploy)
      - name: Run Database Migrations via Kubernetes Jobs
        if: ${{ needs.check-event.outputs.backend_changed == 'true' }}
        run: |
          DOCKER_USER=${{ secrets.DOCKER_USERNAME }}
          if [ -z "$DOCKER_USER" ]; then DOCKER_USER="griox"; fi

          SERVICES=("order-service" "identity-service" "catalog-service" "promotion-service")
          DLLS=("OrderService.Api.dll" "IdentityService.Api.dll" "CatalogService.Api.dll" "PromotionService.Api.dll")

          for i in "${!SERVICES[@]}"; do
            SVC="${SERVICES[$i]}"
            DLL="${DLLS[$i]}"
            JOB_NAME="${SVC}-migration-$(echo $IMAGE_TAG | cut -c1-7)"

            echo ">>> Running migration Job for $SVC..."

            # Delete old job if exists
            kubectl delete job "$JOB_NAME" --ignore-not-found=true

            # Apply migration job inline
            kubectl create job "$JOB_NAME" \
              --image="$DOCKER_USER/bunbo-$SVC:$IMAGE_TAG" \
              -- dotnet "$DLL" --migrate

            # Patch the job to use the correct env from secret
            kubectl patch job "$JOB_NAME" --type=json -p='[
              {"op":"add","path":"/spec/template/spec/containers/0/envFrom","value":[{"secretRef":{"name":"bunbo-secrets"}}]},
              {"op":"replace","path":"/spec/backoffLimit","value":3}
            ]' 2>/dev/null || true

            echo "Waiting for migration job $JOB_NAME to complete..."
            if ! kubectl wait --for=condition=complete job/"$JOB_NAME" --timeout=120s; then
              echo "::error::Migration job failed for $SVC. Aborting deployment."
              kubectl logs "$(kubectl get pods -l job-name=$JOB_NAME -o jsonpath='{.items[0].metadata.name}')" 2>/dev/null || true
              exit 1
            fi

            echo "✅ Migration completed for $SVC"

            # Clean up completed job
            kubectl delete job "$JOB_NAME" --ignore-not-found=true
          done
          echo "All migrations completed successfully."

      # 3. UPDATE CONFIGURATION
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Update Kubernetes Images via Kustomize
        if: ${{ needs.check-event.outputs.backend_changed == 'true' }}
        run: |
          cd infra/k8s
          DOCKER_USER=${{ secrets.DOCKER_USERNAME }}
          if [ -z "$DOCKER_USER" ]; then DOCKER_USER="griox"; fi

          kustomize edit set image griox/bunbo-identity-service=$DOCKER_USER/bunbo-identity-service:${IMAGE_TAG}
          kustomize edit set image griox/bunbo-catalog-service=$DOCKER_USER/bunbo-catalog-service:${IMAGE_TAG}
          kustomize edit set image griox/bunbo-cart-service=$DOCKER_USER/bunbo-cart-service:${IMAGE_TAG}
          kustomize edit set image griox/bunbo-order-service=$DOCKER_USER/bunbo-order-service:${IMAGE_TAG}
          kustomize edit set image griox/bunbo-payment-service=$DOCKER_USER/bunbo-payment-service:${IMAGE_TAG}
          kustomize edit set image griox/bunbo-notification-service=$DOCKER_USER/bunbo-notification-service:${IMAGE_TAG}
          kustomize edit set image griox/bunbo-realtime-service=$DOCKER_USER/bunbo-realtime-service:${IMAGE_TAG}
          kustomize edit set image griox/bunbo-promotion-service=$DOCKER_USER/bunbo-promotion-service:${IMAGE_TAG}
          kustomize edit set image griox/bunbo-api-gateway=$DOCKER_USER/bunbo-api-gateway:${IMAGE_TAG}

      # GitOps: Commit the updated kustomization.yaml back to Git
      - name: Commit Kustomization Changes (GitOps State Sync)
        if: ${{ needs.check-event.outputs.backend_changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet infra/k8s/kustomization.yaml; then
            echo "No kustomization changes to commit (image tags unchanged). Skipping."
          else
            git add infra/k8s/kustomization.yaml
            git commit -m "chore(deploy): update image tags to ${IMAGE_TAG} [skip ci]"
            git pull origin main --rebase || true
            git push origin main
            echo "✅ GitOps state synced — kustomization.yaml committed to main."
          fi

      # 4. DEPLOY Phase
      - name: Apply via Kustomize
        run: kubectl apply -k infra/k8s/

      - name: Verify Rollout Status
        id: verify_rollout
        run: |
          services=("identity-service" "catalog-service" "cart-service" "order-service" "payment-service" "notification-service" "realtime-service" "promotion-service" "api-gateway")

          for service in "${services[@]}"; do
            echo "Waiting for rollout of deployment/$service..."
            if ! kubectl rollout status deployment/$service --timeout=300s; then
              echo "::error::Rollout failed for $service. Checking logs for clues..."
              kubectl get pods -l app=$service --no-headers | awk '{print $1}' | xargs -I{} kubectl logs {} --tail=50
              exit 1
            fi
          done
          echo "All deployments verified successfully."

      # 5. HEALTH CHECK Phase (strict — failure triggers rollback)
      - name: Verify Service Health Endpoints
        id: health_check
        run: |
          echo "Waiting 30s for services to stabilize..."
          sleep 30

          GATEWAY_IP=$(kubectl get svc api-gateway -o jsonpath='{.spec.clusterIP}' 2>/dev/null || echo "")
          if [ -n "$GATEWAY_IP" ]; then
            echo "Checking API Gateway health at $GATEWAY_IP..."
            HEALTH_STATUS=$(kubectl run health-check-${{ github.run_id }} \
              --image=curlimages/curl:latest \
              --restart=Never \
              --rm -i \
              --timeout=60s \
              -- curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://$GATEWAY_IP/health" 2>/dev/null || echo "000")

            echo "Health check returned HTTP $HEALTH_STATUS"
            kubectl delete pod health-check-${{ github.run_id }} --ignore-not-found=true

            if [ "$HEALTH_STATUS" != "200" ]; then
              echo "::error::Health check FAILED — Gateway returned HTTP $HEALTH_STATUS. Triggering rollback."
              exit 1
            fi
            echo "✅ Health check PASSED (HTTP 200)"
          else
            echo "::warning::Could not resolve API Gateway service IP, skipping health check"
          fi

      # 6. CONFIRM or ROLLBACK Phase
      - name: Automated Rollback on Failure
        if: failure() && (steps.verify_rollout.outcome == 'failure' || steps.health_check.outcome == 'failure')
        run: |
          echo "::warning::Deployment or health check failed, initiating automated rollback..."
          services=("identity-service" "catalog-service" "cart-service" "order-service" "payment-service" "notification-service" "realtime-service" "promotion-service" "api-gateway")

          for service in "${services[@]}"; do
            echo "Rolling back deployment/$service..."
            kubectl rollout undo deployment/$service || echo "::warning::No previous rollout history to undo for $service"
            kubectl rollout status deployment/$service --timeout=180s || echo "::error::Rollback confirmation failed for $service"
          done
          exit 1

