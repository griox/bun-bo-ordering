name: BunBo System Microservices CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/BunBo.sln

      - name: Build Solution
        run: dotnet build backend/BunBo.sln -c Release --no-restore

      - name: Run Catalog Unit Tests
        run: dotnet test tests/CatalogService.UnitTests/CatalogService.UnitTests.csproj --no-build -c Release

      - name: Run Identity Unit Tests
        run: dotnet test tests/IdentityService.UnitTests/IdentityService.UnitTests.csproj --no-build -c Release

      - name: Run Identity Integration Tests
        run: dotnet test tests/IdentityService.IntegrationTests/IdentityService.IntegrationTests.csproj --no-build -c Release --logger "console;verbosity=normal"

  build-and-push:
    name: Build and Push
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    strategy:
      matrix:
        service: 
          - { name: 'identity-service', path: 'backend/IdentityService' }
          - { name: 'catalog-service', path: 'backend/CatalogService' }
          - { name: 'cart-service', path: 'backend/CartService' }
          - { name: 'order-service', path: 'backend/OrderService' }
          - { name: 'realtime-service', path: 'backend/RealtimeService' }
          - { name: 'payment-service', path: 'backend/PaymentService' }
          - { name: 'notification-service', path: 'backend/NotificationService' }
          - { name: 'promotion-service', path: 'backend/PromotionService' }
          - { name: 'api-gateway', path: 'backend/ApiGateway' }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./${{ matrix.service.path }}/Dockerfile
          platforms: linux/amd64
          # Only push image on main branch commit
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:latest, ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
