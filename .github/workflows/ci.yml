name: BunBo System Microservices CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: 
          - { name: 'identity-service', path: 'backend/IdentityService' }
          - { name: 'catalog-service', path: 'backend/CatalogService' }
          - { name: 'cart-service', path: 'backend/CartService' }
          - { name: 'order-service', path: 'backend/OrderService' }
          - { name: 'realtime-service', path: 'backend/RealtimeService' }
          - { name: 'payment-service', path: 'backend/PaymentService' }
          - { name: 'notification-service', path: 'backend/NotificationService' }
          - { name: 'promotion-service', path: 'backend/PromotionService' }
          - { name: 'api-gateway', path: 'backend/ApiGateway' }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Log in to Docker Hub
        # Only log in when pushing to main (skip credentials for untrusted PRs)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./${{ matrix.service.path }}/Dockerfile
          platforms: linux/amd64
          # Only push image on main branch commit
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:latest, ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
