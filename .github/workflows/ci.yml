name: BunBo System Microservices CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Folders
    runs-on: ubuntu-22.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      services: ${{ steps.detect-services.outputs.services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Path Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/cd.yml'
            identity-service:
              - 'backend/IdentityService/**'
              - 'backend/BunBo.SharedKernel/**'
            catalog-service:
              - 'backend/CatalogService/**'
              - 'backend/BunBo.SharedKernel/**'
            cart-service:
              - 'backend/CartService/**'
              - 'backend/BunBo.SharedKernel/**'
            order-service:
              - 'backend/OrderService/**'
              - 'backend/BunBo.SharedKernel/**'
            realtime-service:
              - 'backend/RealtimeService/**'
              - 'backend/BunBo.SharedKernel/**'
            payment-service:
              - 'backend/PaymentService/**'
              - 'backend/BunBo.SharedKernel/**'
            notification-service:
              - 'backend/NotificationService/**'
              - 'backend/BunBo.SharedKernel/**'
            promotion-service:
              - 'backend/PromotionService/**'
              - 'backend/BunBo.SharedKernel/**'
            api-gateway:
              - 'backend/ApiGateway/**'
              - 'backend/BunBo.SharedKernel/**'

      - name: Build Dynamic Service Matrix
        id: detect-services
        run: |
          ALL_SERVICES='[
            {"name":"identity-service","path":"backend/IdentityService"},
            {"name":"catalog-service","path":"backend/CatalogService"},
            {"name":"cart-service","path":"backend/CartService"},
            {"name":"order-service","path":"backend/OrderService"},
            {"name":"realtime-service","path":"backend/RealtimeService"},
            {"name":"payment-service","path":"backend/PaymentService"},
            {"name":"notification-service","path":"backend/NotificationService"},
            {"name":"promotion-service","path":"backend/PromotionService"},
            {"name":"api-gateway","path":"backend/ApiGateway"}
          ]'

          MATRIX=$(echo "$ALL_SERVICES" | \
            BACKEND_CHANGED="${{ steps.filter.outputs.backend }}" \
            FILTER_IDENTITY_SERVICE="${{ steps.filter.outputs['identity-service'] }}" \
            FILTER_CATALOG_SERVICE="${{ steps.filter.outputs['catalog-service'] }}" \
            FILTER_CART_SERVICE="${{ steps.filter.outputs['cart-service'] }}" \
            FILTER_ORDER_SERVICE="${{ steps.filter.outputs['order-service'] }}" \
            FILTER_REALTIME_SERVICE="${{ steps.filter.outputs['realtime-service'] }}" \
            FILTER_PAYMENT_SERVICE="${{ steps.filter.outputs['payment-service'] }}" \
            FILTER_NOTIFICATION_SERVICE="${{ steps.filter.outputs['notification-service'] }}" \
            FILTER_PROMOTION_SERVICE="${{ steps.filter.outputs['promotion-service'] }}" \
            FILTER_API_GATEWAY="${{ steps.filter.outputs['api-gateway'] }}" \
            python3 -c "
          import sys, json, os
          services = json.load(sys.stdin)
          changed = [s for s in services if os.environ.get('FILTER_' + s['name'].replace('-','_').upper(), 'false') == 'true']
          # If SharedKernel or ci/cd workflow changed without specific service match, rebuild all
          if not changed and os.environ.get('BACKEND_CHANGED', 'false') == 'true':
              changed = services
          print(json.dumps(changed))
          ")

          echo "services=$MATRIX" >> $GITHUB_OUTPUT
          echo "Detected services to build: $MATRIX"

  test:
    name: Run Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: 'backend/**/*.csproj'

      - name: Restore Dependencies
        run: dotnet restore backend/BunBo.sln

      - name: Build Solution
        run: dotnet build backend/BunBo.sln -c Release --no-restore

      - name: Run All Unit & Integration Tests
        run: |
          dotnet test tests/CatalogService.UnitTests/CatalogService.UnitTests.csproj -c Release --verbosity minimal
          dotnet test tests/IdentityService.UnitTests/IdentityService.UnitTests.csproj -c Release --verbosity minimal
          dotnet test tests/IdentityService.IntegrationTests/IdentityService.IntegrationTests.csproj -c Release --verbosity minimal
          dotnet test tests/CartService.UnitTests/CartService.UnitTests.csproj -c Release --verbosity minimal
          dotnet test tests/OrderService.UnitTests/OrderService.UnitTests.csproj -c Release --verbosity minimal
          dotnet test tests/PromotionService.UnitTests/PromotionService.UnitTests.csproj -c Release --verbosity minimal
          dotnet test tests/NotificationService.UnitTests/NotificationService.UnitTests.csproj -c Release --verbosity minimal
          dotnet test tests/RealtimeService.UnitTests/RealtimeService.UnitTests.csproj -c Release --verbosity minimal

  frontend-checks:
    name: Frontend Lint & Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Frontend Unit Tests
        run: npm run test

      - name: Build Next.js app
        run: npm run build

  build-and-push:
    name: "Build & Push: ${{ matrix.service.name }}"
    needs: [changes, test, frontend-checks]
    runs-on: ubuntu-22.04
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      needs.changes.outputs.services != '[]' &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.frontend-checks.result == 'success' || needs.frontend-checks.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        # Retry up to 3 times for transient Docker Hub network errors
        continue-on-error: false
        id: docker_login
      
      - name: Retry Docker Login if failed
        if: steps.docker_login.outcome == 'failure'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./${{ matrix.service.path }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

  publish-event:
    name: Publish Deploy Event
    needs: [changes, test, frontend-checks, build-and-push]
    runs-on: ubuntu-22.04
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.frontend-checks.result == 'success' || needs.frontend-checks.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    steps:
      - name: Create Event File
        run: |
          cat <<EOF > deploy-event.json
          {
            "backend_changed": ${{ needs.changes.outputs.backend }},
            "infra_changed": ${{ needs.changes.outputs.infra }},
            "frontend_changed": ${{ needs.changes.outputs.frontend }},
            "built_services": ${{ needs.changes.outputs.services }}
          }
          EOF
      - name: Upload Event Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-event
          path: deploy-event.json
          retention-days: 1
