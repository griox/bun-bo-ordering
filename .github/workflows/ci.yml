name: BunBo System Microservices CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: 'backend/**/*.csproj'

      - name: Restore Dependencies
        run: dotnet restore backend/BunBo.sln

      - name: Build Solution
        run: dotnet build backend/BunBo.sln -c Release --no-restore

      - name: Run All Unit & Integration Tests
        run: |
          dotnet test tests/CatalogService.UnitTests/CatalogService.UnitTests.csproj --no-build -c Release --verbosity minimal
          dotnet test tests/IdentityService.UnitTests/IdentityService.UnitTests.csproj --no-build -c Release --verbosity minimal
          dotnet test tests/IdentityService.IntegrationTests/IdentityService.IntegrationTests.csproj --no-build -c Release --verbosity minimal
          dotnet test tests/CartService.UnitTests/CartService.UnitTests.csproj --no-build -c Release --verbosity minimal
          dotnet test tests/OrderService.UnitTests/OrderService.UnitTests.csproj --no-build -c Release --verbosity minimal
          dotnet test tests/PromotionService.UnitTests/PromotionService.UnitTests.csproj --no-build -c Release --verbosity minimal
          dotnet test tests/NotificationService.UnitTests/NotificationService.UnitTests.csproj --no-build -c Release --verbosity minimal
          dotnet test tests/RealtimeService.UnitTests/RealtimeService.UnitTests.csproj --no-build -c Release --verbosity minimal

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Frontend Unit Tests
        run: npm run test

      - name: Build Next.js app
        run: npm run build

  build-and-push:
    name: Build and Push
    needs: [test, frontend-checks]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    strategy:
      matrix:
        service: 
          - { name: 'identity-service', path: 'backend/IdentityService' }
          - { name: 'catalog-service', path: 'backend/CatalogService' }
          - { name: 'cart-service', path: 'backend/CartService' }
          - { name: 'order-service', path: 'backend/OrderService' }
          - { name: 'realtime-service', path: 'backend/RealtimeService' }
          - { name: 'payment-service', path: 'backend/PaymentService' }
          - { name: 'notification-service', path: 'backend/NotificationService' }
          - { name: 'promotion-service', path: 'backend/PromotionService' }
          - { name: 'api-gateway', path: 'backend/ApiGateway' }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./${{ matrix.service.path }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/bunbo-${{ matrix.service.name }}:latest
