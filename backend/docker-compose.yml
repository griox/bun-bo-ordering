services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    init: true
    container_name: bunbo-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bunbo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    init: true
    container_name: bunbo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bunbo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    init: true
    container_name: bunbo-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - bunbo-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Microservices
  identity-service:
    build:
      context: .
      dockerfile: IdentityService/Dockerfile
    init: true
    container_name: bunbo-identity
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoIdentityDb;Username=${POSTGRES_USER:-root};Password=${POSTGRES_PASSWORD:-rootpassword}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=BunBoIdentityService
      - JwtSettings__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS:-guest}
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bunbo-network

  catalog-service:
    build:
      context: .
      dockerfile: CatalogService/Dockerfile
    init: true
    container_name: bunbo-catalog
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoCatalogDb;Username=${POSTGRES_USER:-root};Password=${POSTGRES_PASSWORD:-rootpassword}
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=BunBoIdentityService
      - JwtSettings__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - Kestrel__Endpoints__Http__Protocols=Http1AndHttp2
      - S3Settings__ServiceUrl=${AWS_S3_SERVICE_URL:-http://minio:9000}
      - S3Settings__PublicUrl=${AWS_S3_PUBLIC_URL:-http://localhost:9000}
      - S3Settings__AccessKey=${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      - S3Settings__SecretKey=${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadminpassword}}
      - S3Settings__BucketName=${AWS_S3_BUCKET_NAME:-catalog-images}
      - S3Settings__Region=${AWS_REGION:-}
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bunbo-network

  cart-service:
    build:
      context: .
      dockerfile: CartService/Dockerfile
    init: true
    container_name: bunbo-cart
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - GrpcSettings__CatalogUrl=http://catalog-service:50022
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=BunBoIdentityService
      - JwtSettings__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5003:8080"
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - bunbo-network

  order-service:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    init: true
    container_name: bunbo-order
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoOrderDb;Username=${POSTGRES_USER:-root};Password=${POSTGRES_PASSWORD:-rootpassword}
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS:-guest}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=BunBoIdentityService
      - JwtSettings__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - CartServiceUrl=http://cart-service:8080
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bunbo-network

  realtime-service:
    build:
      context: .
      dockerfile: RealtimeService/Dockerfile
    init: true
    container_name: bunbo-realtime
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS:-guest}
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=BunBoIdentityService
      - JwtSettings__Audience=BunBoClients
    ports:
      - "5005:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bunbo-network

  payment-service:
    build:
      context: .
      dockerfile: PaymentService/Dockerfile
    init: true
    container_name: bunbo-payment
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoPaymentDb;Username=${POSTGRES_USER:-root};Password=${POSTGRES_PASSWORD:-rootpassword}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS:-guest}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=BunBoIdentityService
      - JwtSettings__Audience=BunBoClients
      - SePay__SecretKey=${SEPAY_SECRET_KEY}
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5006:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bunbo-network

  promotion-service:
    build:
      context: .
      dockerfile: PromotionService/Dockerfile
    init: true
    container_name: bunbo-promotion
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoPromotionDb;Username=${POSTGRES_USER:-root};Password=${POSTGRES_PASSWORD:-rootpassword}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS:-guest}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=BunBoIdentityService
      - JwtSettings__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5007:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bunbo-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    init: true
    container_name: bunbo-gateway
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=BunBoIdentityService
      - JwtSettings__Audience=BunBoClients
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-service:8080
      - ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address=http://catalog-service:8080
      - ReverseProxy__Clusters__cart-cluster__Destinations__destination1__Address=http://cart-service:8080
      - ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address=http://order-service:8080
      - ReverseProxy__Clusters__realtime-cluster__Destinations__destination1__Address=http://realtime-service:8080
      - ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address=http://payment-service:8080
      - ReverseProxy__Clusters__promotion-cluster__Destinations__destination1__Address=http://promotion-service:8080
    ports:
      - "8000:8080"
    depends_on:
      - identity-service
      - catalog-service
      - cart-service
      - order-service
      - realtime-service
      - payment-service
      - promotion-service
    networks:
      - bunbo-network

  # Object Storage (S3 Compatible)
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    init: true
    container_name: bunbo-minio
    restart: always
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - bunbo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Centralized Logging (Serilog Sink)
  seq:
    image: datalust/seq:2024.1
    init: true
    container_name: bunbo-seq
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341" # Ingestion port
      - "8081:80"   # UI port
    volumes:
      - seq-data:/data
    networks:
      - bunbo-network

  # Notification Service (Email & SMS)
  notification-service:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    init: true
    container_name: bunbo-notification
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - Serilog__SeqUrl=http://bunbo-seq:5341
      - SmtpSettings__Host=smtp-relay.brevo.com
      - SmtpSettings__Port=2525
      - SmtpSettings__DefaultSenderEmail=noreply@bun-bo-chung-cu.io.vn
      - SmtpSettings__SupportSenderEmail=support@bun-bo-chung-cu.io.vn
      - SmtpSettings__Username=aba245001@smtp-brevo.com
      - SmtpSettings__Password=${BREVO_SMTP_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bunbo-network

networks:
  bunbo-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  seq-data:
