version: '3.8'

services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: bunbo-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bunbo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bunbo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bunbo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bunbo-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - bunbo-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Microservices
  identity-service:
    build:
      context: .
      dockerfile: IdentityService/Dockerfile
    container_name: bunbo-identity
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoIdentityDb;Username=root;Password=rootpassword
      - Jwt__Key=SuperSecretKeyForBunBoSystem123456789!!!
      - Jwt__Issuer=BunBoIdentityService
      - Jwt__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bunbo-network

  catalog-service:
    build:
      context: .
      dockerfile: CatalogService/Dockerfile
    container_name: bunbo-catalog
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoCatalogDb;Username=root;Password=rootpassword
      - Jwt__Key=SuperSecretKeyForBunBoSystem123456789!!!
      - Jwt__Issuer=BunBoIdentityService
      - Jwt__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - Kestrel__Endpoints__Http__Protocols=Http1AndHttp2
      - S3Settings__ServiceUrl=${AWS_S3_SERVICE_URL:-http://minio:9000}
      - S3Settings__PublicUrl=${AWS_S3_PUBLIC_URL:-http://localhost:9000}
      - S3Settings__AccessKey=${AWS_ACCESS_KEY_ID:-minioadmin}
      - S3Settings__SecretKey=${AWS_SECRET_ACCESS_KEY:-minioadminpassword}
      - S3Settings__BucketName=${AWS_S3_BUCKET_NAME:-catalog-images}
      - S3Settings__Region=${AWS_REGION:-}
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bunbo-network

  cart-service:
    build:
      context: .
      dockerfile: CartService/Dockerfile
    container_name: bunbo-cart
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - GrpcSettings__CatalogUrl=http://catalog-service:50022
      - Jwt__Key=SuperSecretKeyForBunBoSystem123456789!!!
      - Jwt__Issuer=BunBoIdentityService
      - Jwt__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5003:8080"
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - bunbo-network

  order-service:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    container_name: bunbo-order
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoOrderDb;Username=root;Password=rootpassword
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Jwt__Key=SuperSecretKeyForBunBoSystem123456789!!!
      - Jwt__Issuer=BunBoIdentityService
      - Jwt__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bunbo-network

  realtime-service:
    build:
      context: .
      dockerfile: RealtimeService/Dockerfile
    container_name: bunbo-realtime
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Redis__ConnectionString=redis:6379,abortConnect=false
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5005:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bunbo-network

  payment-service:
    build:
      context: .
      dockerfile: PaymentService/Dockerfile
    container_name: bunbo-payment
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoPaymentDb;Username=root;Password=rootpassword
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Jwt__Key=SuperSecretKeyForBunBoSystem123456789!!!
      - Jwt__Issuer=BunBoIdentityService
      - Jwt__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5006:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bunbo-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    container_name: bunbo-gateway
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Jwt__Key=SuperSecretKeyForBunBoSystem123456789!!!
      - Jwt__Issuer=BunBoIdentityService
      - Jwt__Audience=BunBoClients
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-service:8080
      - ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address=http://catalog-service:8080
      - ReverseProxy__Clusters__cart-cluster__Destinations__destination1__Address=http://cart-service:8080
      - ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address=http://order-service:8080
      - ReverseProxy__Clusters__realtime-cluster__Destinations__destination1__Address=http://realtime-service:8080
      - ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address=http://payment-service:8080
    ports:
      - "8000:8080"
    depends_on:
      - identity-service
      - catalog-service
      - cart-service
      - order-service
      - realtime-service
      - payment-service
    networks:
      - bunbo-network

  # Object Storage (S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: bunbo-minio
    restart: always
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - bunbo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Centralized Logging (Serilog Sink)
  seq:
    image: datalust/seq:latest
    container_name: bunbo-seq
    restart: always
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:5341" # Ingestion port
      - "8081:80"   # UI port
    volumes:
      - seq-data:/data
    networks:
      - bunbo-network

networks:
  bunbo-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  seq-data:
