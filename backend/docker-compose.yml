version: '3.8'

services:
  # PostgreSQL (Single Instance for multiple schemas/dbs)
  postgres:
    image: postgres:15-alpine
    container_name: bunbo-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: bunbodb # Default db, we can create identity_db, catalog_db etc inside it
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # RabbitMQ for async event bus
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: bunbo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    restart: unless-stopped

  # Redis for Caching & SignalR Backplane
  redis:
    image: redis:7-alpine
    container_name: bunbo-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres-data:
