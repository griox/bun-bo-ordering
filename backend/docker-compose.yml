version: '3.8'

services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: bunbo-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bunbo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bunbo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bunbo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bunbo-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - bunbo-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Microservices
  identity-service:
    build:
      context: .
      dockerfile: IdentityService/Dockerfile
    platform: linux/amd64
    container_name: bunbo-identity
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoIdentityDb;Username=root;Password=rootpassword
      - Jwt__Key=SuperSecretKeyForBunBoSystem123456789!!!
      - Jwt__Issuer=BunBoIdentityService
      - Jwt__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bunbo-network

  catalog-service:
    build:
      context: .
      dockerfile: CatalogService/Dockerfile
    platform: linux/amd64
    container_name: bunbo-catalog
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoCatalogDb;Username=root;Password=rootpassword
      - Jwt__Key=SuperSecretKeyForBunBoSystem123456789!!!
      - Jwt__Issuer=BunBoIdentityService
      - Jwt__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - Kestrel__Endpoints__Http__Protocols=Http1AndHttp2
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bunbo-network

  cart-service:
    build:
      context: .
      dockerfile: CartService/Dockerfile
    platform: linux/amd64
    container_name: bunbo-cart
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - GrpcSettings__CatalogUrl=http://catalog-service:50022
      - Jwt__Key=SuperSecretKeyForBunBoSystem123456789!!!
      - Jwt__Issuer=BunBoIdentityService
      - Jwt__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5003:8080"
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - bunbo-network

  order-service:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    platform: linux/amd64
    container_name: bunbo-order
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BunBoOrderDb;Username=root;Password=rootpassword
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Jwt__Key=SuperSecretKeyForBunBoSystem123456789!!!
      - Jwt__Issuer=BunBoIdentityService
      - Jwt__Audience=BunBoClients
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bunbo-network

  realtime-service:
    build:
      context: .
      dockerfile: RealtimeService/Dockerfile
    platform: linux/amd64
    container_name: bunbo-realtime
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Redis__ConnectionString=redis:6379,abortConnect=false
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "5005:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bunbo-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    platform: linux/amd64
    container_name: bunbo-gateway
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Jwt__Key=SuperSecretKeyForBunBoSystem123456789!!!
      - Jwt__Issuer=BunBoIdentityService
      - Jwt__Audience=BunBoClients
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Kestrel__Endpoints__Http__Url=http://+:8080
    ports:
      - "6000:8080"
    depends_on:
      - identity-service
      - catalog-service
      - cart-service
      - order-service
      - realtime-service
    networks:
      - bunbo-network

networks:
  bunbo-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
