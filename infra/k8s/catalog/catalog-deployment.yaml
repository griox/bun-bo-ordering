apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog-service
        image: griox/bunbo-catalog-service:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m" # Có thể burst CPU
            memory: "256Mi" # Giới hạn RAM cứng để tránh OOM toàn node
        livenessProbe:
          tcpSocket:
            port: 5002
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 5002
          initialDelaySeconds: 5
          periodSeconds: 10

        ports:
        - name: http
          containerPort: 5002
        - name: grpc
          containerPort: 50022
        envFrom:
        - configMapRef:
            name: bunbo-config
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: bunbo-config
              key: Postgres__Host
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: bunbo-config
              key: Postgres__Port
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: bunbo-config
              key: Postgres__Database
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: bunbo-config
              key: Postgres__Username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bunbo-secrets
              key: POSTGRES_PASSWORD
        - name: ConnectionStrings__DefaultConnection
          value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
        - name: S3Settings__ServiceUrl
          valueFrom:
            configMapKeyRef:
              name: bunbo-config
              key: S3Settings__ServiceUrl
        - name: S3Settings__BucketName
          valueFrom:
            configMapKeyRef:
              name: bunbo-config
              key: S3Settings__BucketName
        - name: S3Settings__AccessKey
          valueFrom:
            secretKeyRef:
              name: bunbo-secrets
              key: S3_ACCESS_KEY
        - name: S3Settings__SecretKey
          valueFrom:
            secretKeyRef:
              name: bunbo-secrets
              key: S3_SECRET_KEY
        - name: S3Settings__Region
          valueFrom:
            configMapKeyRef:
              name: bunbo-config
              key: S3Settings__Region
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  type: ClusterIP
  selector:
    app: catalog-service
  ports:
  - name: http
    port: 80
    targetPort: 5002
    protocol: TCP
  - name: grpc
    port: 50022
    targetPort: 50022
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
