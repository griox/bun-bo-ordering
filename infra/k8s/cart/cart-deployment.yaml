apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  labels:
    app: cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      nodeSelector:
        role: apps
      containers:
      - name: cart-service
        image: griox/bunbo-cart-service:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m" # Có thể burst CPU
            memory: "256Mi" # Giới hạn RAM cứng để tránh OOM toàn node
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: bunbo-config
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: bunbo-config
              key: Redis__Host
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bunbo-secrets
              key: REDIS_PASSWORD
        - name: ConnectionStrings__Redis
          value: "$(REDIS_HOST),password=$(REDIS_PASSWORD),abortConnect=false"
        - name: GrpcSettings__CatalogUrl
          value: "http://catalog-service:50022"
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
spec:
  type: ClusterIP
  selector:
    app: cart-service
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cart-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cart-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
