apiVersion: batch/v1
kind: Job
metadata:
  name: order-service-migration
  namespace: bunbo-system
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
      - name: order-migration
        image: ${DOCKER_USER}/bunbo-order-service:${IMAGE_TAG}
        command: ["dotnet", "OrderService.Api.dll", "--migrate"]
        envFrom:
        - secretRef:
            name: bunbo-secrets
      restartPolicy: Never
---
