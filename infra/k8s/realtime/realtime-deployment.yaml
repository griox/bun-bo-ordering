apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-service
  labels:
    app: realtime-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: realtime-service
  template:
    metadata:
      labels:
        app: realtime-service
    spec:
      nodeSelector:
        role: apps
      containers:
      - name: realtime-service
        image: griox/bunbo-realtime-service:latest
        resources:
          requests:
            cpu: "30m"
            memory: "128Mi"
          limits:
            cpu: "150m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 5005
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5005
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6

        ports:
        - name: http
          containerPort: 5005
        envFrom:
        - configMapRef:
            name: bunbo-config
        env:
        - name: JwtSettings__Secret
          valueFrom:
            secretKeyRef:
              name: bunbo-secrets
              key: JWT_SECRET
        - name: RabbitMq__Password
          valueFrom:
            secretKeyRef:
              name: bunbo-secrets
              key: RABBITMQ_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: bunbo-config
              key: Redis__Host
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bunbo-secrets
              key: REDIS_PASSWORD
        - name: ConnectionStrings__Redis
          value: "$(REDIS_HOST),password=$(REDIS_PASSWORD),abortConnect=false"
        - name: Services__OrderService
          value: "http://order-service"
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-service
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  selector:
    app: realtime-service
  ports:
  - port: 80
    targetPort: 5005

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realtime-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realtime-service
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 2
        periodSeconds: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bunbo-realtime-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Required for SignalR with multiple replicas
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "signalr-route"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
spec:
  tls:
  - hosts:
    - api.bun-bo-chung-cu.io.vn
    secretName: bunbo-api-tls
  rules:
  - host: api.bun-bo-chung-cu.io.vn
    http:
      paths:
      - path: /hub
        pathType: Prefix
        backend:
          service:
            name: realtime-service
            port:
              number: 80
