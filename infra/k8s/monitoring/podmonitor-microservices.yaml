apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: bunbo-microservices-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchExpressions:
      - key: app
        operator: Exists
  namespaceSelector:
    matchNames:
      - default
  podMetricsEndpoints:
  - port: http
    path: /metrics
    interval: 15s
